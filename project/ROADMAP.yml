project: ai-workforce-manager
owner: Lauren McGuire

milestones:
  - id: M1
    name: Roster schema and synthetic workload
    due: 2026-09-18
    status: done
    done_criteria:
      - roster.yml validated (skills 0-1, autonomy 1-4, managers exist)
      - seeded 8-week task stream regenerates byte-identically
  - id: M2
    name: Routing engine (round-robin, skill-based, cost-aware)
    due: 2026-10-02
    status: done
    done_criteria:
      - three routers behind one interface
      - cost-aware score formula covered by tests
  - id: M3
    name: Human-in-the-loop policy, escalation and audit log
    due: 2026-10-16
    status: done
    done_criteria:
      - autonomy x risk approval rule
      - low-confidence escalation
      - every decision written to the audit log
  - id: M4
    name: Simulation and KPIs
    due: 2026-10-23
    status: done
    done_criteria:
      - day-step simulation with reviewer capacity and fatigue
      - per-agent and fleet KPIs, strategy comparison table
  - id: M5
    name: Performance reviews, RACI and capacity planning
    due: 2026-10-30
    status: done
    done_criteria:
      - rule-based review with evidence for every agent
      - RACI matrix exported to Markdown
      - supervisor hours forecast for next month
  - id: M6
    name: Live LLM agent adapter
    due: 2026-12-11
    status: planned
    done_criteria:
      - AgentAdapter interface that the simulator and a live agent both implement
      - replayable fixtures so tests never call the network
      - confidence calibration measured on live outputs
  - id: M7
    name: Workforce dashboard
    due: 2027-01-29
    status: planned
    done_criteria:
      - read-only dashboard over summary.json and the audit log
      - drill-down from strategy to agent to audit events

