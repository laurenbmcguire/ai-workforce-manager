  # latency in minutes, quality_bonus is added to proficiency in the success model.
  small:  { cost_per_task: 0.35, latency_minutes: 2,  quality_bonus: -0.04 }
  medium: { cost_per_task: 1.40, latency_minutes: 6,  quality_bonus: 0.00 }
  large:  { cost_per_task: 4.80, latency_minutes: 15, quality_bonus: 0.05 }

autonomy_levels:
