policy:
  # Minimum autonomy level an agent needs to act WITHOUT human approval, by task risk.
  # 5 means "never without approval" (regulated work always gets a human sign-off).
  autonomy_thresholds: { low: 3, medium: 3, high: 4, regulated: 5 }
  escalation_confidence: 0.55     # agent confidence below this escalates to a human
  confidence_noise_sd: 0.12       # how noisy the agent's self-reported confidence is
  review_catch_rate: 0.85         # share of errors a fresh reviewer catches
  fatigue_threshold: 0.85         # reviewer utilisation above which catch rate drops
  fatigue_catch_drop: 0.20        # catch-rate drop for a fatigued reviewer (automation bias)
  suggest_only_review_multiplier: 1.5  # level-1 agents need more human effort per review
  audit_sample_rate: 0.10         # share of act-with-audit work sampled post hoc
  audit_minutes: 3
  review_turnaround_hours: 0.5
  human_success_rate: 0.97        # escalations handled by a person
  human_hourly_cost: 85.0
  load_penalty: 8.0               # USD penalty at 100% of an agent's daily capacity
  sla_miss_value_factor: 0.5      # value retained when a task misses its SLA
  incident_cost: { low: 40, medium: 150, high: 600, regulated: 2500 }
